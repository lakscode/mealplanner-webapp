<div class="recipes-home-body inner-page">
    <div class="container">
    <div class="row">
    <div class="col-12 col-md-12 col-lg-9">
        <div class="recipe-set submit-recipe-set">
            <h2>Recipe Book</h2>
            <p>Recipe book is selection of the recipes based on ingredients,  health labels or nutrients from our list of recipes.  </p>
            <div style="width:100%; text-align:right">
                <a class="copy-button" (click)="downloadplan()" title="Download PDF"><i class="fa fa-download"></i> Download</a>
            </div>    
            <div class="submit-recipe-form">
                <form action="#" method="post">
                    <label for="title">Recipe book Title</label>
                    <input type="text" name="title" id="title" [(ngModel)]="searchRes.recipebook_name">
                    <br>
                    <label for="description">Description</label>
                    <textarea class="short-text" name="description" [(ngModel)]='searchRes.description' id="description" cols="30" rows="10"></textarea>
 
                   
                 
                    
                    <div class="row">
                        <div class="col-12 col-md-6 col-lg-6">
                            <label  class='comment-label'>Upload Image</label>
                            <button (click)="fileupload()" class="upload-comment">
                               <i class="fa fa-picture-o" aria-hidden="true"></i> Upload Image</button>
                           <div>
                               <input id="inputuploadrecipe" hidden type="file" name="inputuploadrecipe" (change)="onFileSelect($event)" />
                             </div>
                             <img *ngIf="searchRes.image" src="{{searchRes.image}}"  style="width: 90%; max-width: 200px;" />
                     
                             
                          </div>

                       
                    </div>
                    <div class="row">
                        <div class="col-12" style="text-align:right">
                            <button class="add-recipe" (click)="addNew()" >Add Recipe</button>
                        </div>
                    </div>
                    <div class="row" style="padding-left:0px; padding-right:0px;">
                        <div class="col-12 col-lg-6 col-md-6" *ngFor="let recipe of recipesList; let i = index;">
                            <div class="recipe-item">
                            <div class='row'>
                                <div class="col-4">
                                    <img style="width:100%" src="{{recipe.image}}" />
                                </div>
                                <div class="col-8">
                                    <h1 class="recipe-label">{{recipe.label}}</h1>                                  
                                   
                                </div>
                                <div class="col-12">
                                    <p><b><em>Calories</em></b>: {{recipe.calories}} Kcal, <b><em>Servings</em></b>: {{recipe.yield}}</p>
                                </div>
                                <div class="col-12" *ngIf="recipe.dietLabels">
                                    <p><b><em>Diet Labels</em></b>: {{recipe.dietLabels}} </p>
                                </div>
                               
                            </div>
                        </div>
                           

                        </div>
                    </div>
                    <br>
                    <label for="notes">Notes</label>
                    <textarea class="short-text" name="notes" [(ngModel)]='searchRes.notes' id="notes" cols="30" rows="10"></textarea>
                    <div class="text-center">
                        <button type="submit" (click)="saveRecipebook()"  class="recipe-submit-btn">Save Your Recipe Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="col-12  col-md-4 col-lg-3">
    <aside>
    <div class="side-bar">
   
    <!--popular recipes widget-->
    <app-sidebar></app-sidebar>
    <!--popular recipes widget ends-->
    
    </div>
    </aside>
    </div>
    </div>
    
    </div>
    </div>

    <jw-modal id="addnew">
    
    <form name="form"  #uf="ngForm" novalidate class="popup-panel">
        <div class="modal-header" style="background:#FFF;">
            <h4>
                <span>Add Recipe</span>
                

            </h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="closeModal('addnew');">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body" style="background:#FFF;" *ngIf="addItem">

            <div class="row">
                <div class='col-12 col-lg-12'>
                    <div class="form-group">
                     
                                
                    </div>
                   

                </div>
               

                <div class='col-12'>
                    <div class="form-group">
                        <button class="defaultbtn" type="submit">Save</button>
                    </div>
                </div>
            </div>

        </div>

    </form>
</jw-modal>
