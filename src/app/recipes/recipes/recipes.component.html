<div class="recipes-home-body inner-page">
    
    <div class="container">
        <div class="row">
            <div class="col-md-8 col-lg-9">
                <div class="wrapper-search">
                   <!--  <div class="container-tags">
                        <span class="tag">
                            <span class="tag-inner">Find Recipes <i
                                    class="fa fa-angle-down"></i></span>
                        </span>
    
                    </div> -->
                <div class="row" >
                    <div class="col-12 "  style="margin:0; padding-left:0px; padding-right:0px;">
                        <div style="background:#FFF;  padding-left: 10px; padding-right: 10px;">
                            <label class="searchicon ">
                                <i class="fa fa-search" aria-hidden="true"></i>
                            </label>
                            <input type="text" [(ngModel)]="searchparam.q" class="inputbox" placeholder="Search Recipes..." />
                            <input  type="button"  (click)="searchProps()" style="margin-bottom:10px;" 
                            [ngClass]="searchmorebar?'defaultbtn searchbtn hideonmobile bg-orange' :' defaultbtn searchbtn  bg-orange'" id="header-submit-search-pro" name="submit" value="Search">
                        </div>
                
                        <div *ngIf="searchmorebar && showNutrientsFlag" class="searchmorebar {{animClass}}">
                            <div class="row">
                                <div class="col-12 col-md-6 col-lg-3 paddinglr0">
                                    <div class="form-group">

                                        <label class="form-control-placeholder fcs">Health Labels </label>
                                        <div class="listSection" id="healthLabels" style="display:inline-block;">

                                            <ng-container *ngFor="let hlabel of healthlabelsList; let h = index">
                                                <label class="container" style="font-size:12px">{{hlabel.name}}
                                                    <input [(ngModel)] ="hlabel.selected" type="checkbox" [checked]="h == 0?'checked':''">
                                                    <span class="checkmark"></span>
                                                </label>
                                            </ng-container>

                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6  col-lg-3 paddinglr0">
                                    <div class="form-group">
                                        <label class="form-control-placeholder fcs">Diet Labels</label> 
                                        <div class="listSection" id="diethLabels" style="display:inline-block;">
                                           
                                            <ng-container *ngFor="let dlabel of dietLabelsList; let h = index">
                                                <label class="container" style="font-size:12px">{{dlabel.name}}
                                                    <input [(ngModel)] ="dlabel.selected" type="checkbox" [checked]="h == 0?'checked':''">
                                                    <span class="checkmark"></span>
                                                </label>
                                            </ng-container>

                                        </div>
                                    </div>
                                </div>
                                
                                  <div class="col-12  col-md-6 col-lg-3 paddinglr0">
                                    <div class="form-group">
                                        <label class="form-control-placeholder fcs">Nutrients</label> 
                                        <div class="listSection"  style="display:inline-block; height:145px; width: 90%; max-height:145px; overflow:auto;">
                                            <ng-container *ngFor="let mlabel of mineralsLabelsList; let m = index">
                                                <div class="row paddinglr0">
                                                    <div class="col-12 paddinglr0">
                                                        <label class="container" style="font-size:12px">{{setFLU(mlabel.name)}}
                                                            <input [(ngModel)] = 'mlabel.selected' type="checkbox" [checked]="m == 0?'checked':''">
                                                            <span class="checkmark"></span>
                                                        </label>
                                                    </div>
                                                    <div class="col-5 paddinglr0" *ngIf="mlabel.selected">
                                                      
                                                            <input class="mineral-input" type='text' name="minerals_{{m}}_min" [(ngModel)]="mlabel.min" placeholder="min" />
                                                            <span class="maxmin">{{formatVal(mlabel.t_min)}}</span>
                                                    
                                                    </div>
                                                    <div class="col-5 paddinglr0" *ngIf="mlabel.selected">
                                                        <input class="mineral-input" type='text' name="minerals_{{m}}_max" [(ngModel)]="mlabel.max" placeholder="max" />
                                                        <span class="maxmin">{{formatVal(mlabel.t_max)}}</span>

                                                    </div>
                                                    <div class="col-2 paddinglr0" *ngIf="mlabel.selected"> {{mlabel.unit}}</div>
                                                </div>
                                              
                                               
                                            </ng-container>

                                        </div>
                                    </div>
                                  </div>
                                  <div class="col-12 col-lg-3 paddinglr0">
                                    <div class="form-group">
                                        <label class="form-control-placeholder fcs">Calories</label> 
                                        <div class="listSection"  style="display:inline-block;">
                                            <span>Max calories</span>
                                          <input [(ngModel)]="maxcalories" type="text" class="inputbox-fullwidth" />

                                        </div>
                                    </div>
                                </div>
       
                
                                <div class="col-12 showonmobile">
                                    <input type="button" (click)="searchProps()" style="margin-bottom:10px;" class="defaultbtn searchbtn" id="header-submit-search-pro" name="submit" value="Search">
                
                                </div>
                
                            </div>
                            
                              
                        
                        </div>
                
                        <div *ngIf='showNutrientsFlag' class="header-more-search-btn" (click)="toggleMore()">
                            <i *ngIf="!searchmorebar" class="fa fa-chevron-down" aria-hidden="true"></i>
                            <i *ngIf="searchmorebar" class="fa fa-chevron-up" aria-hidden="true"></i>
                        </div>
                
                
                    </div>
                        
                        
                
                </div>
    
                </div>
                <div style='height:20px; width:100%'></div>
                <div class="recipe-set">
                    <div class="listing-buttons">
                        <span (click)="setListorGrid('grid')"
                            [ngClass]="listorgrid.menu == 'grid'?'grid current':'grid' "><i
                                class="fa fa-th-large"></i></span>
                        <span (click)="setListorGrid('grid')"
                            [ngClass]="listorgrid.menu == 'list'?'list current':'list'"><i
                                class="fa fa-bars"></i></span>
                    </div>
                    <h2>Recipes</h2>

                    <ul class="pagination" *ngIf="totalPage >= 10">
                        <li (click)="currentPage(0)" class="">
                            <a href="javascript:void(0)">
                                <i class="fa fa-angle-double-left"></i>
                            </a>
                        </li>
                        <li (click)="prevPage()" class="">
                            <a href="javascript:void(0)">
                                <i class="fa fa-angle-left"></i>
                            </a>
                        </li>
                        
                        <li (click)="currentPage(i)" [ngClass]="i == page_num?'current':''" *ngFor='let in of counter(totalPage) ;let i = index'>
                            <a href="javascript:void(0)">{{i+1}}</a>
                        </li>
                        <li (click)="nextPage()" class="">
                            <a href="javascript:void(0)">
                                <i class="fa fa-angle-right"></i>
                            </a>
                        </li>
                        <li (click)="currentPage(totalPage-1)" class="">
                            <a href="javascript:void(0)">
                                <i class="fa fa-angle-double-right"></i>
                            </a>
                        </li>   
                    </ul>
                    <div class="recipe-listing {{listorgrid.panel}}">


                        <div class="listing" *ngFor="let recipe1 of displayList; let i = index;">
                            <div class="image">
                                <a (click)="gotoRecipeDetails(recipe1.id)">
                                    <img class="tstbite-animation" src="{{formatImage(recipe1.image, 'm')}}"
                                        alt="image">
                                </a>
                            </div>
                            <div class="detail">
                                <h4><a (click)="gotoRecipeDetails(recipe1.id)">{{recipe1.label}}</a></h4>
                                <p innerHTML="{{limitTo(recipe1.s_instructions, 200)}}">

                                </p>
                                <p>Calories: {{recipe1.calories}} Kcal</p>
                                <div class="meta-listing">
                                    <!--<div style="display:block;color: #5e676b;">
                                        Calories: {{recipe1.calories}} Kcal
                                    </div>-->
                                    <div *ngIf="showNutrientsFlag" style="display:inline-block;color: #5e676b;">
                                        Calories per Serving: {{formatValuePServing(recipe1.calories, recipe1.yield)}} Kcal
                                    </div>
                                    <!--<ul class="post-meta">
                  <li>Calories: {{recipe1.calories}}</li>
                 <li class="calendar">{{recipe1.created_at}}</li>
              </ul>-->
                                    <div class="rating-box">
                                        <span class="rating-icons" *ngFor="let item of [1,2,3,4,5]">
                                            <i [ngClass]="item <= recipe1.displayrating?'fa fa-star rating-h':'fa fa-star rating'"></i>
                                        </span>
                                        <span class="rating-figure">{{recipe1.displayrating}}</span>
                                    </div>
                                </div>
                            </div>
                        </div>



                        <!--recipe of the day-->
                       <!-- <div class="recipe-of-day">
                            <img src="assets/images/temp-images/recipe-of-the-day.jpg" alt="Recipe of the day">
                            <div class="recipe-contents-outer">
                                <div class="recipe-contents text-center">
                                    <div class="recipe-content-inner">
                                        <span class="tag">Recipe of the Day</span>
                                        <h2><a href="javascript:void(0)">Pasto Pizza With Fillas Cheese Topping</a></h2>
                                        <div class="short-separator"></div>
                                        <p>
                                            Nam ornare arcu turpis, nec congu
                                            Curabitur quis euismod...
                                        </p>
                                        <a class="read-more" href="javascript:void(0)">read more</a>
                                    </div>
                                </div>
                            </div>
                        </div>-->
                        <!--recipe of the day ends-->

                        <div class="banner-header text-center">
                            <a href="javascript:void(0)">
                                <img src="assets/images/temp-images/header-banner.jpg" alt="banner">
                            </a>
                        </div>


<!--
                        <div class="listing" *ngFor="let recipe2 of recipesList2; let i = index;">
                            <div class="image">
                                <a (click)="gotoRecipeDetails(recipe2.id)">
                                    <img src="{{formatImage(recipe2.image, 'm')}}" alt="image">
                                </a>
                            </div>
                            <div class="detail">
                                <h4><a (click)="gotoRecipeDetails(recipe2.id)">{{recipe2.label}}</a></h4>
                                <p innerHTML="{{limitTo(recipe2.s_instructions, 200)}}">

                                </p>
                                <div class="meta-listing">
                                    <div style="display:inline-block;color: #5e676b;">
                                        Calories: {{recipe2.calories}} Kcal
                                    </div>
                                 
                                    <div class="rating-box">
                                        <span class="rating-icons" *ngFor="let item of [1,2,3,4,5]">
                                            <i class="fa fa-star"></i>
                                        </span>
                                        <span class="rating-figure">{{recipe2.displayrating}}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    -->


                        <ul class="pagination" *ngIf="totalPage >= 10">
                            <li (click)="currentPage(0)" class="">
                                <a href="javascript:void(0)">
                                    <i class="fa fa-angle-double-left"></i>
                                </a>
                            </li>
                            <li (click)="prevPage()" class="">
                                <a href="javascript:void(0)">
                                    <i class="fa fa-angle-left"></i>
                                </a>
                            </li>
                            
                            <li (click)="currentPage(i)" [ngClass]="i == page_num?'current':''" *ngFor='let in of counter(totalPage) ;let i = index'>
                                <a href="javascript:void(0)">{{i+1}}</a>
                            </li>
                            <li (click)="nextPage()" class="">
                                <a href="javascript:void(0)">
                                    <i class="fa fa-angle-right"></i>
                                </a>
                            </li>
                            <li (click)="currentPage(totalPage-1)" class="">
                                <a href="javascript:void(0)">
                                    <i class="fa fa-angle-double-right"></i>
                                </a>
                            </li>   
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-3">
                <aside>
                    <div class="side-bar">

                        <app-sidebar></app-sidebar>


                    </div>
                </aside>
            </div>
        </div>

    </div>
</div>
