<div class="fixedtop recipes-home-body inner-page">
    
    <div class="container" style="padding-left:0; padding-right:0;padding-top:20px">
        <div class="row">
            <div class="col-md-8 col-lg-9">
                <div style='width:100%'></div>
                <div class="recipe-set">
                  <!--   <div class="listing-buttons">
                        <span (click)="setListorGrid('grid')"
                            [ngClass]="listorgrid.menu == 'grid'?'grid current':'grid' "><i
                                class="fa fa-th-large"></i></span>
                        <span (click)="setListorGrid('grid')"
                            [ngClass]="listorgrid.menu == 'list'?'list current':'list'"><i
                                class="fa fa-bars"></i></span>
                    </div> -->
                    <h2>My Recipes</h2>

                    <div class="add2mealplan">
                        <a [ngClass]="showpopupflag?'menu active':'menu'"  (click)="showpopupflag = !showpopupflag" href="javascript:void(0)"><i class="fa fa-ellipsis-h" aria-hidden="true"></i></a>
                        <div *ngIf='showpopupflag' class="add2mealplanmenu" style='height:120px'>
                            <a (click)="showpopupflag = false; recipeFromUrlFlag = true; " href="javascript:void(0)">
                                <i class="fa fa-link"></i> Save from URL
                            </a>
                            <a (click)="showpopupflag = false; gotopage('recipesubmit');" href="javascript:void(0)">
                                <i class="fa fa-pencil"></i>  Create New
                            </a>
                        </div>
                        <div *ngIf="recipeFromUrlFlag" class="add2mealplanmenu" style="height:250px;">
                            <div class="row">
                              <div class='col-12'>
                                <div class="custom-item">
                                  <div style="float:left">
                                <h2 class="title" style="margin-top:0px;">Import Recipe from URL</h2>
                                </div>
                               
                                <div (click)="recipeFromUrlFlag = !recipeFromUrlFlag"  style="float:right;font-size:24px;padding-top: 0px;
                                padding-right: 0px;" class="right" >
                                <h1 style="margin-top:0px;font-size:24px;"> <i class="fa- fa-close'"></i></h1>
                          
                                </div>
                              </div>
                          
                            </div>
                              <div class='col-12'>
                                <textarea style="width:100%;padding:5px; border-radius:5px;margin-bottom:10px;" type="text" rows=4 placeholder="Enter recipe url" [(ngModel)]= "recipeurl"   name="recipeurl" (keyup.enter)="checkrecipeexists()"></textarea>
                          
                              </div>
                              <div class='col-12' style="text-align:center">
                                 <button [disabled]="recipeurl == ''" style="width: 100%; " class='btn' (click)="recipeFromUrlFlag = false; checkrecipeexists()" >Import</button>
                              </div>
                          
                            </div>
                          
                          </div>
                        </div>


                        <!-- new design -->

                         <div class="row">


                        <div class="col-12 col-lg-4 col-md-4" *ngFor="let recipe1 of recipesList1; let i = index;">
                            <div class="collection-item">
                            <div class="image image-animate" >
                                <div style="position:absolute; left:unset;top:10px;right:10px;z-index:1">
                                    <a (click)="showhidecontent(recipe1)" href="javascript:void(0)" [ngClass]="recipe1.showpopup?'contextmenu-icon active bgcontext':'contextmenu-icon bgcontext'" style="text-align:center;"><i class="fa fa-ellipsis-v"></i></a>
                                        <div *ngIf="recipe1.showpopup" class="contextmenu" style="left:unset;top:25px; right:0px;"><a  class="menu" href="javascript:void(0)"  (click)="gotoRecipeDetails('recipedetails', recipe1.id)" ><i class="fa fa-list"></i>View Recipe</a>
                                           <a  (click)="gotoRecipeDetails('recipesubmit', recipe1.id)" class="menu" href="javascript:void(0)"><i class="fa fa-pencil-square-o"></i>Edit Recipe</a>
                                        </div>
                                        </div>
                                <a (click)="gotoRecipeDetails('recipedetails', {'id':recipe1.id});">
                                    <img *ngIf="recipe1.image !== ''"  src="{{recipe1.image}}"
                                        alt="{{recipe1.label}}">
                                    <img *ngIf="recipe1.image == ''"  src="assets/notavailable.png" alt="{{recipe1.label}}">
                                </a>

                                <div class="detail">
                                    <a (click)="gotoRecipeDetails('recipedetails', recipe1.id)" ><h3 style="font-size:16px">{{recipe1.label}}</h3></a>
                                   
                                  </div>
                            </div>
                            
                            </div>
                        </div>
                      
                    </div>

                        <!--  ends -->


          
                    
                </div>
            </div>
            <div class="col-md-4 col-lg-3">
                <aside>
                    <div class="side-bar">

                        <app-sidebar></app-sidebar>


                    </div>
                </aside>
            </div>
        </div>

    </div>
</div>
