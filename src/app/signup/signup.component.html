  <div class="loginPanel" style="margin:20px;">
    <div class="login-wrap">
      <div class="login-html">				
    
     <label for="tab-21" class="tab">Sign Up</label>
		
        <div class="login-form">
          
          <div class="">
            <div *ngIf="errorMessage  !== ''" class="group">
            <p class="loginerror">{{errorMessage }}</p>
          </div>

            <div class="group">
              <label for="username" class="label">Username</label>
              <input (focus)="clearError('signup')" id="username" name= "username" [(ngModel)]="userObj.username" type="text" class="input" required>
            </div>
            <div class="group">
              <label for="email" class="label">Email Address</label>
              <input (focus)="clearError('signup')" id="email" name="email" [(ngModel)]="userObj.email"  type="text" class="input" required>
            </div>            
            <div class="group">
              <label for="password" class="label">Password</label>
              <input (focus)="errorPassMatch= ''; clearError('signup')" id="password" name="password" [(ngModel)]="userObj.password"  type="password" class="input" data-type="password" required>
            </div>
            <div class="group">
              <label for="confirmpass" class="label">Repeat Password</label>
              <input (blur)="matchPass()" (focus)="errorPassMatch= '';clearError('signup')" id="confirmpass" name="confirmpass" [(ngModel)]="userObj.confirmpass"  type="password" class="input" data-type="password" required>
            </div>
          <div *ngIf="errorPassMatch !== ''" class="group">
            <p class="loginerror">{{errorPassMatch}}</p>
          </div>
            
            <div class="group">
              <input type="button" [disabled]="userObj.confirmpass !== userObj.password" (click)="signup()" class="button" value="Sign Up">
            </div>
            <div class="hr"></div>
            <div class="foot-lnk">
              <label for="tab-1">Already Member? <a style="cursor:pointer;" (click)="gotopage('login')">Login</a></label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <br/>
