<div class=" recipes-home-body inner-page" style="padding-top:0px">


    <div class="container" style="padding-left:0; padding-right:0;">
        <div class="row">
            <div class="col-md-12 col-lg-12 col-xs-12">
                <div class="recipe-set">
                    <h2 style="width:60% !important">Manage Collections</h2>
                            <div class="sortBtn" (click)="showFilters = !showFilters">
    <i class="fa fa-ellipsis-h" style="margin-right:10px;"></i>    
     
  </div>
                
                <div>
                   <!--  <a href="javascript:void(0)" style="font-size:20px;" (click)="showFilters = !showFilters">
                        <i class="fa fa-ellipsis-h" aria-hidden="true"></i>
                    </a> -->
                   <div *ngIf="showFilters" style="position: absolute;
                   width: 150px;
                   height: 160px;
                   top: 20px;
                   right: 0;
                   z-index: 1;
                   background: #FFF;
                   border: 1px solid #ccc;
                   padding-top: 20px;
                   border-radius: 10px;
                   padding-left: 15px;">
                    <div style="display:block">
                        <label class="container lblcheckbox">Submitted
                            <input (change)="showFilters= false;filterRecords('submitted')" [(ngModel)]='filterOpts.submitted' type="checkbox">
                            <span class="checkmark"></span>
                        </label>
                    </div>

                    <div style="display:block">
                        <label class="container lblcheckbox">Approved
                            <input (change)="showFilters= false;filterRecords('approved')" [(ngModel)]='filterOpts.approved' type="checkbox">
                            <span class="checkmark"></span>
                        </label>
                    </div>

                    <div style="display:block">
                        <label class="container lblcheckbox">Rejected
                            <input (change)="showFilters= false;filterRecords('rejected')" [(ngModel)]='filterOpts.rejected' type="checkbox">
                            <span class="checkmark"></span>
                        </label>
                    </div>

                    <div style="display:block">
                        <label class="container lblcheckbox">All
                            <input (change)="showFilters= false;filterRecords('all')" [(ngModel)]='filterOpts.all' type="checkbox">
                            <span class="checkmark"></span>
                        </label>
                    </div>
                    </div>
                    </div>
                    </div>
                <!-- <div style='height:15px; width:100%'></div> -->
                <div style="width:100%">
                <h3 style="font-weight:bold;margin-left:10px">{{setFLU(recordType)}} Collections</h3>
                </div>
                <div class="recipe-set" *ngIf="!noResult">
                   
                    <div class="">


                        <div class="listing" style="margin-bottom:0px;"
                            *ngFor="let data of dataList; let i = index;">


                            <div class="image image-animate detail"
                                style="width: 100px; height:100px;background:#f8f8f8;padding:0px;">

                                <img (click)="gotopage('collection',data.id)" style="object-fit:cover; width:100%; height:100%"
                                    src="{{data.image}}" alt="image">

                            </div>
                            <div class="detail" style="width:100%;">
                                
                                <div class="row">
                                    <div class="col-10">
                                        <h4><a (click)="gotopage('collection',data.id)">{{data.collection_name}}</a>

                                        </h4>
                                       <p>Submitted by {{data.firstname}} on {{data.created_at}}</p>
                                       <p *ngIf="data.approved_by > 0 && data.status > 0">
                                           <span *ngIf="data.status == 1">Approved</span> 
                                           <span *ngIf="data.status == 2">Rejected</span> 
                                           on {{data.approved_at}}</p>
                                    </div>
                                    <div class="col-2" >
                                        <p>Actions</p>
                                        <select  name = "collect{{i}}" [(ngModel)] = "data.opt" (change)="chooseactions(data)">
                                            <option [selected] = "data.status == 1"  value = "1">Approve</option>
                                            <option [selected] = "data.status == 2"  value = "2">Reject</option>

                                        </select>
                                    </div>

                                </div>
                            </div>
                        </div>

  

                    </div>
                </div>
                <div class="recipe-set" *ngIf="noResult">
                    <p> No Results</p>
                </div>
            </div>
            <!--   <div class="col-md-4 col-lg-3">
                <aside>
                    <div class="side-bar">

                        <app-sidebar></app-sidebar>


                    </div>
                </aside>
            </div> -->
        </div>

    </div>
</div>
