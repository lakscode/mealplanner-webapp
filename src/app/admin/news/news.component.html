<div class="row bgborder"  *ngIf="isAuthorised">
	<div class="col-12">
		<div class="section-header corange onlydesktop">Manage News</div>
		<div class="section-header corange onlymobile">News</div>
	</div>
	<div class="col-12 paddingt0 onlydesktop" style="text-align:right;margin-bottom:10px" >		
		<button (click)="modifyNews('')" class="btnadd">Add New News</button>
	</div>
	<div class="col-12 " *ngIf="news.length > 0">
		<div class="tablpanel onlydesktop" style="padding-bottom:0px;border:1px solid #CCC">
			<div class="grid-wrapper gridall" >
                <ag-grid-angular #agGrid  id="myGrid" class="ag-theme-balham gridclass"
                    [rowData]="rowData" [gridOptions]="gridOptions" [paginationAutoPageSize]="true" [pagination]="true"
                    (cellClicked)='onCellClicked($event)'>
                </ag-grid-angular>               
			</div>						
		</div>
		<div class="onlymobile">
			<ng-container *ngFor="let newsData of news; let i = index;">		
			<div class='col-12 col-lg-12 col-xl-12 infoModal' *ngIf="newsData.deleted === '0'" >							
				<p class="mDetails"><span>Title :</span> {{newsData.title}}</p>
				<p class="mDetails"><span>News :</span> {{newsData.details}}</p>	
			</div>
		</ng-container>
	</div>			
	</div>
	<div class="col-12 " *ngIf="news.length == 0">
		<span class="norecords">{{errorMessage}}</span>
	</div>
</div>
<div *ngIf="!isAuthorised">
	<span>	You are not authorized to view this page.</span>
</div>
<jw-modal id="isNewNews" style="display:none;" >
	<form name="form" (ngSubmit)="addNewsData(uf)" #uf="ngForm" novalidate class="popup-panel">
		<div class="modal-header" *ngIf='newNews' style=" background:#FFF;color:#000;padding:10px;">
			<h4>
				<span>{{modalheadingAddEdit}}</span>
			</h4>
			<button type="button" class="close" data-dismiss="modal" aria-label="Close"
				(click)="closeModal('isNewNews');">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>
		<div class="modal-body" *ngIf='newNews'  style=" background:#FFF;color:#000;text-align:left">
			
			<div class="row">
				<div class='col-12'>
					<div class="form-group">
						<label
						[ngClass]="'inputlabel'"
							for="title">Title <span class="mandatory">&#42;</span></label>
					
						<input type="text" autocomplete="off" id="title" name="title"
							class="form-control " [disabled]="viewMode" [(ngModel)]="newNews.title" required
							#title="ngModel">
						<div *ngIf="formSubmitted && title.invalid" class="alert alert-danger">
							<div *ngIf="title.errors.required">Title is required</div>
							
						</div>
					</div>
				</div>
				
				<div class='col-12'>
					<div class="form-group">
						<label
						[ngClass]="'inputlabel'"
							for="link">Link </label>
					
						<input type="text" autocomplete="off" id="link" name="link"
							class="form-control " [disabled]="viewMode" [(ngModel)]="newNews.link"
							#link="ngModel">
		
					</div>
				</div>
				<div class='col-12'>
					<div class="form-group">
						<label
						[ngClass]="'inputlabel'"
							for="details">News <span class="mandatory">&#42;</span></label>
					
						<textarea rows="4" id="details" name="details" class="form-control"
						#details= "ngModel" [(ngModel)]="newNews.details" required ></textarea>

						<div *ngIf="formSubmitted && details.invalid" class="alert alert-danger">
								<div *ngIf="details.errors.required">News is required</div>
								<!-- <div *ngIf="email.errors.email">Email must be a valid email address</div> -->
						</div>
					</div>
					
				</div>

				
				<!-- <div class='col-12' *ngIf="newUserWoEmail.role == 'REALTOR'">
					<div class="form-group">
						<label for="file-upload" class="custom-file-upload" >
    				      <i class="fa fa-cloud-upload"></i> Upload Picture
   						</label>
  					<input class="customfile" id="file-upload" type="file"  />
     				</div>
				</div> -->
				
				<div *ngIf="!viewMode" class='col-12'>
					<div class="form-group">
						<button class="defaultbtn" type="submit">Save</button>
					</div>
				</div>
			</div>

		
		</div>
		

	</form>
</jw-modal>
<jw-modal id="popupformessage" style="display:none">
	<div class="popup-panel">
		<div class="modal-header">
			<h4>{{modalHeading}}</h4>
			<button type="button" class="close" data-dismiss="modal" aria-label="Close"
				(click)="closeModal('popupformessage');">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>
		<div class="modal-body">
			<div class="row" *ngIf="modaltext">
				<div class="col-12 col-lg-12 col-xl-12 infoModal" innerHTML="{{modaltext}}">
				</div>
			</div>
		</div>
	</div>
</jw-modal>

<jw-modal id="isModelActive" style="display:none;" width="50%">
	<form name="form" (ngSubmit)="saveStatus(userform)" #userform="ngForm" novalidate class="popup-panel">
		<div class="modal-header" *ngIf='statusData' style=" background:#FFF;color:#000;padding:10px;">
			<h4>
				<span *ngIf="statusData['id'] !== ''">Modify News</span>
				<span *ngIf="statusData['id'] == ''">Add New News</span>

			</h4>
			<button type="button" class="close" data-dismiss="modal" aria-label="Close"
				(click)="closeModal('isModelActive');">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>
		<div class="modal-body" *ngIf='statusData' style=" color:#000;text-align:left">

			<div class="row">
				<div class='col-12'>
					<div class="input-group">
						<label
							[ngClass]="'inputlabel'"
							for="newDeleted">Active </label>
						<input type="checkbox"  name = "newdeleted" id="newDeleted" value="{{statusData.active}}" [(ngModel)]= "statusData.active">
	
					</div>
				
				</div>

			</div>
		</div>
		<div class="modal-footer" style=" background:#FFF;">
			<div class="input-group">
				<button class="defaultbtn" type="submit">Save</button>
			</div>
		</div>
	</form>
</jw-modal>
