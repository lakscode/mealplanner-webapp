<div class="fixedtop recipes-home-body inner-page">
  <div class="container" style="padding-left:0; padding-right:0">
  <div class="row">
  <div class="col-12">
  <div class="recipe-set">
  <!--<div style="margin-right:0px" class="create-button anim-button btn-4" (click)="gotopage('plan-create');">
    <i class="fa fa-plus"></i>  New Plan
     
     
  </div>-->

 

  <h2 style="width: 66%;">Your Meal Plans</h2>
  <div class="createplanbtn" (click)="createNewPlan()">
    <i class="fa fa-pencil" style="margin-right:10px;"></i>  Create New Plan    
     
  </div>
</div>

  <div class="recipe-listing listing-list" style="background:#FFF;padding-top:15px;">
  
  <p *ngIf='loadingData && (mealPlans && mealPlans.length == 0)'>Loading meal plans...</p>
  <p *ngIf='!loadingData && (mealPlans && mealPlans.length == 0)'>You haven't created mealplans...</p>
  <div class="listing col-12 col-lg-4 col-md-4 "style='height:160px' *ngFor="let mplan of mealPlans; let i = index;">
     
      <div class="detail"  style="width:100%">
          <h4 (click)="gotopage('plancreate', {'id':mplan.id});" ><a style="width:90%" href="javascript:void(0)">{{mplan.name}}</a></h4>
          <p (click)="gotopage('plancreate', {'id':mplan.id});"  innerHTML = "{{mplan.tags}}" *ngIf="mplan.tags"></p>
          <p (click)="gotopage('plancreate', {'id':mplan.id});"  *ngIf="!mplan.tags">&nbsp;</p>
          <div  href="javascript:void(0)" >
            <a (click)="editmealplan(mplan)" title="Edit Meal Plan - {{mplan.name}}" class="editicon"><i class="fa fa-pencil-square-o" aria-hidden="true"></i></a>
         
               </div> 
      </div>

    


     
  </div>
  

 
  </div>
  
  </div>

  </div>
  
  </div>
  </div>

  <jw-modal id="createNewPlan" [width]="40" >
    
    <form name="form"  #uf="ngForm" novalidate class="popup-panel" >
        <div class="modal-header">
            <h2 style="margin:15px; ">
                <span *ngIf="plan.id == ''">Create New Plan</span>           
                <span *ngIf="plan.id !== ''">Modify Meal Plan</span>           

            </h2>
            <button style="font-size: 30px;padding:5px;" type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="closeModal('createNewPlan');">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body"  > 
             <div class="submit-recipe-form">
               <input class="trans-input" type="text" name="planname" id="planname" placeholder="Enter Plan name..." [(ngModel)]="plan.name" style="padding-left:10px">
                <input class="trans-input" type="text" name="tags" id="tags" placeholder="Enter Tags..." [(ngModel)]="plan.tags" style="padding-left:10px">
                <input class="trans-input" type="text" name="maxcaloryperday" id="maxcaloryperday" placeholder="Enter Maximum Calories." [(ngModel)]="plan.maxcaloryperday" style="padding-left:10px">

                           
             </div>
              <div class="text-center">
                            <button type="submit" [disabled] = "plan.name == ''" [ngClass]="plan.name !== ''?'submit-comment active':'submit-comment'" (click)="checkMealPlan()" >Save </button>
                        </div>

        </div>
    </form>
</jw-modal>
