<div class="recipes-home-body inner-page">
    <div class="container">

        <div class="recipe-set submit-recipe-set">
            <h2>Submit Recipe</h2>
            <p>Food Recipe theme include a Recipe Submit Template. It allow users to submit a recipe with featured image and related details. A user
                should be logged in to submit a recipe. </p>
    
            <div class="submit-recipe-form">
                <form action="#" method="post">
                    <label for="title">Recipe Title</label>
                    <input type="text" name="title" id="title">
                    <br>
                    <label for="short-description">Short Description</label>
                    <textarea class="short-text" name="short-des" id="short-description" cols="30" rows="10"></textarea>
                    <!--<label for="recipe-content">Recipe Contents</label>
                    <textarea name="content" id="recipe-content" cols="30" rows="10"></textarea>-->
                    <label for="upload-image">Upload Images</label>
                    <input type="file" name="fileUpload" id="upload-image">

                        <label for="ingredients">Ingredients</label>
                        <ul class="list-sortable ingredients-list ui-sortable">
                            <li style="">
                                <div class="add-fields">
                                    <span class="handler-list ui-sortable-handle"><i class="fa fa-arrows"></i></span>
                                    <input type="text" name="ingredients[]" id="ingredients">
                                    <span class="del-list"><i class="fa fa-trash"></i></span>
                                </div>
                            </li>
                        <li style=""><div class="add-fields"> <span class="handler-list"><i class="fa fa-arrows"></i></span> <input type="text" name="ingredients[]" id="ingredients"> <span class="del-list"><i class="fa fa-trash"></i></span></div></li><li style=""><div class="add-fields"> <span class="handler-list"><i class="fa fa-arrows"></i></span> <input type="text" name="ingredients[]" id="ingredients"> <span class="del-list"><i class="fa fa-trash"></i></span></div></li></ul>
                                             <span class="add-button add-ing">
                                                <i class="fa fa-plus"></i>
                                            </span>
                    </fieldset>
    
                    <fieldset class="ingredient-set">
                        <label for="steps">Steps</label>
                        <ul class="list-sortable steps ui-sortable">
                            <li style="">
                                <div class="add-fields">
                                    <span class="handler-list ui-sortable-handle"><i class="fa fa-arrows"></i></span>
                                    <textarea class="short-text" name="steps" id="steps" cols="30" rows="10">    </textarea>
                                    <span class="del-list"><i class="fa fa-trash"></i></span>
                                </div>
                            </li>
                        <li style=""><div class="add-fields"> <span class="handler-list"><i class="fa fa-arrows"></i></span><textarea class="short-text" name="steps" id="steps" cols="30" rows="10">    </textarea> <span class="del-list"><i class="fa fa-trash"></i></span></div></li></ul>
                                             <span class="add-button add-steps">

                                            </span>
                    </fieldset>
    

                    <fieldset class="ingredient-set">
                        <label for="nutrients">Nutrients</label>
                        <ul class="list-sortable ingredients-list ui-sortable">
                            <li style="">
                                <div class="add-fields">
                                    <span class="handler-list ui-sortable-handle"><i class="fa fa-arrows"></i></span>                                   
                                    <div style="width:40%" class="selectric-wrapper selectric-advance-selectable"><div class="selectric-select"><select name="cuisine" id="cuisine" class="advance-selectable" tabindex="0">
                                        <option value="" selected="selected">Select Nutrient</option>
                                        <option *ngFor="let nutrient of nutrientsList; let n = index"; value="{{nutrient}}">{{nutrient}}</option>
                  
                                    </select></div></div>

                                    <input type="text" name="nutrients[]" id="nutrients">
                                    <span class="del-list"><i class="fa fa-trash"></i></span>
                                </div>
                            </li>
                            <li style=""><div class="add-fields"> <span class="handler-list"><i class="fa fa-arrows"></i></span>  <input type="text" name="nutrients[]" id="nutrients">  <input type="text" name="nutrients[]" id="nutrients"> <span class="del-list"><i class="fa fa-trash"></i></span></div></li>
                            <li style=""><div class="add-fields"> <span class="handler-list"><i class="fa fa-arrows"></i></span> <input type="text" name="nutrients[]" id="ingredients"> <input type="text" name="nutrients[]" id="ingredients"> <span class="del-list"><i class="fa fa-trash"></i></span></div></li>
                    
                        </ul>
                                             <span class="add-button add-ing">
                                                <i class="fa fa-plus"></i>
                                            </span>
                    </fieldset>

                    <label class="video-based-recipe">Video Based Recipe</label>
                    <br>
                    <label for="radio-yes">
                        <input class="radio-btn" id="radio-yes" type="radio" name="video-recipe" value="yes" checked=""><span class="radio-text">yes</span>
                    </label>
                    <label for="radio-no">
                        <input class="radio-btn" id="radio-no" type="radio" name="video-recipe" value="no"> <span class="radio-text">no</span>
                    </label>
                    <br>
                    <br>
                    <label for="video-embed">Video Embed Code</label>
                    <textarea class="short-text" name="embed-code" id="video-embed" cols="30" rows="10"></textarea>
                    
                    <div class="row">
                        <div class="col-sm-6">
                            <label for="yield">Yield</label>

                        </div>
                        <div class="col-sm-6">
                            <label for="servings">Servings</label>
                            <input type="text" name="s_servings" id="s_servings">
                        </div>
                    </div>
