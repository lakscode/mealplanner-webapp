<div class="loginPanel" style="margin:20px;">
	<div class="login-wrap">
		<div class="login-html">				
			<!--<button (click)="selectOpt('signup')">Signin</button>-->
			<input id="tab-11" type="radio"  name="tab" class="sign-in" checked><label for="tab-11" class="tab">Sign In</label>
			<input id="tab-21" type="radio"  name="tab" class="sign-up"><label for="tab-21" class="tab"></label>
			<div class="login-form">
				<div class="sign-in-htm">
					<div class="group">
						<label for="userl" class="label">Username</label>
						<input id="userl" name = "userl" [(ngModel)]="userObj.username"  type="text" class="input" required>
					</div>
					<div class="group">
						<label for="passl" class="label">Password</label>
						<input id="passl" name="passl" [(ngModel)]="userObj.password"   type="password" class="input" data-type="password" required (keyup.enter)="login()">
					</div>
					<div class="group">
						<input id="check" type="checkbox"checked>
						<label for="check">&nbsp;Keep me Signed in</label>
					</div>
					<div *ngIf="errorMessage !== ''" class="group">
					<p class="loginerror">{{errorMessage}}</p>
					</div>
					<div class="group">
						<input type="button" (click)="login()" class="button" value="Sign In">
					</div>
					<div class="hr"></div>
					
					<div class="foot-lnk">
						<label for="tab-1">Don't have an account? <a (click)="gotopage('pricing')">Sign Up</a></label>
					</div>

				</div>
				<div class="sign-up-htm" style="display:none">
					<!-- <div *ngIf="errorSignup !== ''" class="group">
						<p class="loginerror">{{errorSignup}}</p>
					</div> -->
					<div class="group">
						<label for="user1l" class="label">Username</label>
						<input (focus)="clearError('signup')" id="user1l" name= "user1l" [(ngModel)]="userObj.username" type="text" class="input" required>
					</div>
					<div class="group">
						<label for="pass0l" class="label">Password</label>
						<input (focus)="errorPassMatch= ''; clearError('signup')" id="pass0l" name="pass0l" [(ngModel)]="userObj.password"  type="password" class="input" data-type="password" required>
					</div>
					<div class="group">
						<label for="pass1l" class="label">Repeat Password</label>
						<input (blur)="matchPass()" (focus)="errorPassMatch= '';clearError('signup')" id="pass1l" name="pass1l" [(ngModel)]="userObj.confirmpass"  type="password" class="input" data-type="password" required>
					</div>
					<!-- <div *ngIf="errorPassMatch !== ''" class="group">
						<p class="loginerror">{{errorPassMatch}}</p>
					</div> -->
					<div class="group">
						<label for="emaill" class="label">Email Address</label>
						<input (focus)="clearError('signup')" id="emaill" name="emaill" [(ngModel)]="userObj.email"  type="text" class="input" required>
					</div>
					
					<div class="group">
					<!-- 	<input type="button" [disabled]="userObj.confirmpass !== userObj.password" (click)="signUpNewUser(userObj)" class="button" value="Sign Up"> -->
					</div>
					<div class="hr"></div>
					<div class="foot-lnk">
						<label for="tab-1">Already Member?</label>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<br/>
