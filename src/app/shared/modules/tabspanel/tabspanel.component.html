<div *ngIf="recipesList1.length > 0 || recipesList2.length > 0 || recipesList3.length > 0" class="tab-container">
    <ul class="tabs-nav clearfix">
        <li class="active"><a href="">Most rated</a></li>
        <li><a href="">popular</a></li>
        <li><a href="">random</a></li>
    </ul>
    <div class="tabs-container">
    <div class="tab-content">
        <div class="content-inner" *ngFor="let recipe1 of recipesList1; let i1= index;">
            <div class="left-side">
                <a href="javascript:void(0)"><img style="width:84px; height:64px" src="{{recipe1.image}}" alt="image"/></a>
            </div>
            <div class="right-side">
                <h3><a href="javascript:void(0)">{{recipe1.label}}</a></h3>
                <div class="rating-box">
                    <span class="rating-icons"><!-- *ngFor="let item of [1,2,3,4,5]"-->
                        <i *ngIf="recipe1.displayrating >=1" class="fa fa-star"></i>
                        <i *ngIf="recipe1.displayrating >=2" class="fa fa-star"></i>
                        <i *ngIf="recipe1.displayrating >=3" class="fa fa-star"></i>
                        <i *ngIf="recipe1.displayrating >=4" class="fa fa-star"></i>
                        <i *ngIf="recipe1.displayrating >=5" class="fa fa-star"></i>

                      </span>
                    <span class="rating-figure">{{recipe1.displayrating}}</span>
                </div>
            </div>
        </div>

    </div>


    <div class="tab-content">
        <div class="content-inner" *ngFor="let recipe2 of recipesList2; let i2= index;">
            <div class="left-side">
                <a href="javascript:void(0)"><img style="width:84px; height:64px" src="{{recipe2.image}}" alt="image"/></a>
            </div>
            <div class="right-side">

                <div class="rating-box">
                    <span class="rating-icons" >
                        <i *ngIf="recipe2.displayrating >=1" class="fa fa-star"></i>
                        <i *ngIf="recipe2.displayrating >=2" class="fa fa-star"></i>
                        <i *ngIf="recipe2.displayrating >=3" class="fa fa-star"></i>
                        <i *ngIf="recipe2.displayrating >=4" class="fa fa-star"></i>
                        <i *ngIf="recipe2.displayrating >=5" class="fa fa-star"></i>

                      </span>
                    <span class="rating-figure">{{recipe2.displayrating}}</span>
                </div>
            </div>
        </div>


    </div>


    <div class="tab-content">
        <div class="content-inner" *ngFor="let recipe3 of recipesList3; let i3= index;">

        </div>

    </div>
